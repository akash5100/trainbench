[project]
name = "trainbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "safetensors>=0.8.0",
    "transformers>=5.23.0",
    "wandb>=0.31.1",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
tpu = [
    "flax>=0.12.8",
    "jax>=0.10.2",
    "jax[tpu]>=0.10.2 ; sys_platform == 'linux'",
    "optax>=0.2.9",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.setuptools.packages.find]
include = ["trainbench*"]
